checkpoint_path: /ckpt.tar
experiment_dir: /output
forward_steps_in_memory: 40
loader:
  dataset:
    # zarr stores are selected by file_pattern within data_path; the loader globs
    # data_path/file_pattern and defaults to "*.nc", so engine must be set too
    data_path: "/climate-default/2026-06-08-vertically-resolved-c96-1deg-shield-amip-ensemble-dataset"
    file_pattern: "ic_0002.zarr"
    engine: "zarr"
  num_data_workers: 8
  start_indices:
    times:
    - '2001-01-01T00:00:00'
aggregator:
  log_zonal_mean_images: false
  log_histograms: true
data_writer:
  save_monthly_files: false
  save_prediction_files: false
logging:
  project: ace
